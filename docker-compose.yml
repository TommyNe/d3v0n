version: '3'

services:
###> doctrine/doctrine-bundle ###
    database:
        # arm compatible mysql docker image
        image: mysql/mysql-server:${MYSQL_VERSION:-8.0} # arm and x86/x64 compatible mysql image
        environment:
            MYSQL_ROOT_PASSWORD: password
            MYSQL_DATABASE: sulu
            # You should definitely change the password in production
            MYSQL_USER: sulu
            MYSQL_PASSWORD: password
        ports:
            - 3306:3306
        logging:
            driver: none
            options:
                tag: "{{.DaemonName}}(image={{.ImageName}};name={{.Name}};id={{.ID}})"
        volumes:
            - db-data:/var/lib/mysql
        networks:
            - symfony_app
            # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
            # - ./docker/db/data:/var/lib/mysql:rw
###< doctrine/doctrine-bundle ###
    php:
        build:
            context: ./php
            args:
                TIMEZONE: ${TIMEZONE}
        volumes:
            - ./public/:/var/www/symfony/public/
            - ./node_modules:/var/www/symfony/node_modules
            - ./:/var/www/symfony
            - symfony_app_var:/var/www/symfony/var
            - symfony_app_vendor:/var/www/symfony/vendor
        networks:
            - symfony_app

    nginx:
        container_name: nginx_d3v0n
        image: nginx:latest
        ports:
            - 80:80
        volumes:
            - ./node_modules:/var/www/symfony/node_modules
            - ./public/:/var/www/symfony/public/
            - ./:/var/www/symfony
            - ./http/default.conf:/etc/nginx/conf.d/default.conf
            - symfony_app_var:/var/www/symfony/var
            - symfony_app_vendor:/var/www/symfony/vendor
        networks:
            - symfony_app
        env_file:
            - .env.nginx


volumes:
###> doctrine/doctrine-bundle ###
    db-data:
###< doctrine/doctrine-bundle ###
    symfony_app_var:
    symfony_app_vendor:

networks:
    symfony_app:
