server {
  listen 80;
  server_name _;

  root /www;
  index index.html;

  # Optional: Caching für statische Assets
  location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA-Fallback für React
  location / {
    try_files $uri /index.html;
  }
}